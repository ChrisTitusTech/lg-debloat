<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=1280,height=720,initial-scale=1"><title>Home</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#101418;color:#f5f6f7;font-family:Arial,sans-serif}main{padding:52px 76px}header{height:66px}h1{margin:0;font-size:28px;font-weight:400;letter-spacing:1px;color:#b7c0c8}#clock{float:right;font-size:25px;color:#b7c0c8}.apps{display:flex;margin:8px -10px 32px}.tile{border:3px solid transparent;border-radius:14px;color:#f5f6f7;background:#20282f;outline:0;cursor:pointer;text-align:left;font-family:Arial,sans-serif}.app{width:544px;height:195px;margin:0 10px;padding:32px 38px;font-size:44px;font-weight:bold}.youtube{background:#292125}.plex{background:#26271f}.mark{display:block;margin-bottom:18px;font-size:31px;line-height:35px;color:#ff514f}.plex .mark{color:#e5b343}.label{font-size:18px;color:#9daab4;letter-spacing:2px;margin:0 0 14px}.inputs{display:flex;flex-wrap:wrap;margin:0 -10px}.input{width:356px;height:92px;margin:0 10px 18px;padding:18px 26px;font-size:26px}.sub{display:block;margin-top:5px;font-size:15px;color:#a8b5bf}.selected{border-color:#d8ecf7;background:#33434e;box-shadow:0 0 0 3px #101418,0 0 0 5px #d8ecf7}#status{height:28px;font-size:18px;color:#bccbd4;margin-top:2px}footer{position:absolute;bottom:28px;left:76px;color:#687883;font-size:15px}
body{background-size:cover;background-position:center;background-repeat:no-repeat}
h1,#clock,.label{color:#eef4f7;text-shadow:0 2px 6px #101418}
.tile{background:rgba(15,25,34,0.76)}.youtube{background:rgba(36,22,27,0.78)}.plex{background:rgba(32,31,20,0.78)}
.selected{background:rgba(43,65,79,0.94)}footer{color:#d7e0e7;text-shadow:0 2px 5px #101418}
#photo-credit{position:absolute;right:76px;bottom:28px;color:#d7e0e7;font-size:14px;text-shadow:0 2px 5px #101418}
</style></head><body><main><header><span id="clock"></span><h1>Home</h1></header>
<div class="apps"><button class="tile app youtube" data-id="youtube.leanback.v4"><span class="mark">&#9654;</span>YouTube</button><button class="tile app plex" data-id="cdp-30"><span class="mark">&gt;</span>Plex</button></div>
<p class="label">TV INPUTS</p><div class="inputs"><button class="tile input" data-id="com.webos.app.hdmi1">HDMI 1<span class="sub">Input 1</span></button><button class="tile input" data-id="com.webos.app.hdmi2">HDMI 2<span class="sub">Input 2</span></button><button class="tile input" data-id="com.webos.app.hdmi3">HDMI 3<span class="sub">Input 3</span></button><button class="tile input" data-id="com.webos.app.livetv">Live TV<span class="sub">Antenna / cable</span></button><button class="tile input" data-id="com.webos.app.externalinput.av1">AV<span class="sub">Composite input</span></button><button class="tile input" data-id="com.webos.app.externalinput.component">Component<span class="sub">Component input</span></button></div><div id="status" role="status"></div></main><footer>Arrows to choose &nbsp; / &nbsp; OK to open</footer>
<div id="photo-credit"></div><script src="backgrounds.js"></script>
<script src="home.js"></script></body></html>
